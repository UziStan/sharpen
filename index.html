<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharpen Drills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: exercise-book page — squared paper ground, white sheets, red-pen marking as the one flourish */
:root{
  --paper:#F5F7F3; --sheet:#FFFFFF; --ink:#1F2328; --muted:#5D6571; --line:#DCE2E7; --grid:rgba(48,94,170,.075);
  --pencil:#F2B705; --pencil-deep:#B98800; --on-pencil:#1F2328;
  --blue:#2456C7; --blue-soft:#E8EEFC; --red:#D22B40; --red-soft:#FCEAED; --green:#1D8549; --green-soft:#E2F3E9; --margin:#F2A9B3;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif; --f-hand:'Caveat','Comic Sans MS','Segoe Print',cursive;
  --r:14px; --shadow:0 1px 0 rgba(31,35,40,.04),0 6px 18px -12px rgba(31,35,40,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13161B; --sheet:#1B1F26; --ink:#E8EBEF; --muted:#9BA5B2; --line:#2C323B; --grid:rgba(130,165,230,.06);
  --pencil:#F5C232; --pencil-deep:#E0AE1E; --on-pencil:#17191C;
  --blue:#89A9FF; --blue-soft:#1E2840; --red:#FF7383; --red-soft:#3A1D24; --green:#58CB8D; --green-soft:#16301F; --margin:#6B3440;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13161B; --sheet:#1B1F26; --ink:#E8EBEF; --muted:#9BA5B2; --line:#2C323B; --grid:rgba(130,165,230,.06);
  --pencil:#F5C232; --pencil-deep:#E0AE1E; --on-pencil:#17191C;
  --blue:#89A9FF; --blue-soft:#1E2840; --red:#FF7383; --red-soft:#3A1D24; --green:#58CB8D; --green-soft:#16301F; --margin:#6B3440;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -14px rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;background:none;border:0;padding:0}
.brand svg{width:34px;height:20px;flex:none}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{background:none;border:0;padding:8px 12px;border-radius:10px;font-weight:500;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--paper);box-shadow:inset 0 -3px 0 var(--pencil)}
.who{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:var(--sheet);max-width:42vw}
.who label{font-size:12px;color:var(--muted)}
.who select{border:0;background:transparent;font-weight:600;max-width:150px;padding:4px;text-overflow:ellipsis}

.wrap{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:600;border:1.5px solid var(--line);background:var(--sheet);line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn-go{background:var(--pencil);border-color:var(--pencil);color:var(--on-pencil);box-shadow:0 2px 0 var(--pencil-deep)}
.btn-go:hover{border-color:var(--pencil-deep)}
.btn-go:active{transform:translateY(1px);box-shadow:0 1px 0 var(--pencil-deep)}
.btn-go[disabled]{opacity:.5;cursor:not-allowed}
.btn-quiet{background:none;border-color:transparent;color:var(--muted)}
.btn-quiet:hover{color:var(--ink);border-color:var(--line)}
.btn-danger{color:var(--red);border-color:var(--red-soft)}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn-lg{padding:14px 22px;font-size:17px;border-radius:14px}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.hello{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.015em}
.hello em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--pencil) 55%,transparent) 62%);padding:0 2px}
.sub{color:var(--muted);margin:6px 0 20px;max-width:60ch}
.form{display:grid;gap:14px}
.group{padding:18px 20px}
.g-label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.g-label h2{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.g-label .aside{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--sheet);font-weight:500;font-size:14px;transition:background .12s,border-color .12s}
.chip:hover span{border-color:var(--muted)}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.chip input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.chip input:disabled+span{opacity:.45;cursor:not-allowed}
.grades .chip span{width:52px;height:52px;justify-content:center;border-radius:14px;font-family:var(--f-display);font-size:24px;font-weight:700;padding:0}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{position:relative;display:block}
.card input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.card .c-in{display:block;height:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--sheet)}
.card:hover .c-in{border-color:var(--muted)}
.card input:checked+.c-in{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),inset 4px 0 0 var(--pencil)}
.card input:focus-visible+.c-in{outline:3px solid var(--blue);outline-offset:2px}
.c-title{display:block;font-family:var(--f-display);font-weight:700;font-size:18px}
.c-desc{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.row2{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px}
.inline-field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.inline-field input{width:84px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet)}
.linkish{background:none;border:0;padding:0;color:var(--blue);font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.topics .chip span{font-size:13.5px;padding:7px 12px}
.warn{color:var(--red);font-size:13px;margin-top:8px}

.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px}
.sum-card{padding:20px}
.sum-card h2{font-size:22px;margin-bottom:12px}
.sum-list{margin:0;display:grid;gap:8px}
.sum-list div{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:7px}
.sum-list dt{color:var(--muted)}
.sum-list dd{margin:0;font-weight:600;text-align:right}
.sum-card .btn-go{width:100%;margin-top:16px}
.keys{font-size:12.5px;color:var(--muted);margin-top:12px}
kbd{font-family:var(--f-body);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--paper)}
.recent{padding:16px 20px}
.recent h3{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.recent ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.recent li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.recent .sc{font-family:var(--f-hand);font-size:20px;font-weight:700;color:var(--red);line-height:1}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.startbar{display:none}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.qbar .ctx{font-size:13.5px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1 1 160px;min-width:120px}
.track i{display:block;height:100%;background:var(--pencil);border-radius:99px;transition:width .3s}
.timer{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--sheet);font-variant-numeric:tabular-nums}
.timer svg{width:16px;height:16px}
.timer.low{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.qcard{position:relative;padding:26px 28px 24px 52px;min-height:340px}
.qcard::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--margin)}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
.qmeta .qn{font-weight:600;color:var(--ink)}
.tag{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--pencil-deep)}
.flagged{color:var(--pencil-deep);font-weight:600}
.qtext{font-family:var(--f-body);font-weight:500;font-size:clamp(19px,2.4vw,24px);line-height:1.4;margin:4px 0 20px;max-width:46ch;text-wrap:pretty}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 44px 13px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);font-size:17px;min-height:56px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--muted)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .k{border-color:var(--blue);background:var(--blue);color:var(--sheet)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .k{border-color:var(--green);background:var(--green);color:var(--sheet)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .t{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.opt.dim{opacity:.55}
.mk{position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(-8deg);font-family:var(--f-hand);font-size:34px;font-weight:700;line-height:1}
.mk.ok{color:var(--green)}.mk.no{color:var(--red)}
.typed{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.typed input{flex:1 1 220px;min-width:0;font-size:20px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);font-variant-numeric:tabular-nums}
.typed input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.typed .hint-line{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.typed.ok input{border-color:var(--green);background:var(--green-soft)}
.typed.no input{border-color:var(--red);background:var(--red-soft)}
.qact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.qact .spacer{flex:1}
.hintbox{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--blue-soft);font-size:14.5px}
.hintbox b{color:var(--blue)}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;border:1.5px dashed var(--line)}
.fb-head{font-family:var(--f-hand);font-size:30px;font-weight:700;line-height:1;margin:0 0 6px}
.fb.ok .fb-head{color:var(--green)}.fb.no .fb-head{color:var(--red)}
.fb-ans{margin:0 0 8px;font-weight:600}
.fb-why{margin:0;font-size:14.5px;color:var(--ink)}
.fb-why b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.qside{display:grid;gap:14px}
.side-card{padding:16px 18px}
.side-card h3{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.navgrid button{position:relative;height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--sheet);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.navgrid button.done{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.navgrid button.cur{box-shadow:0 0 0 2px var(--ink)}
.navgrid button.fl::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--pencil-deep)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--line)}
.legend .l-done::before{background:var(--blue)}.legend .l-fl::before{background:var(--pencil-deep);border-radius:50%}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tally div{background:var(--paper);border-radius:10px;padding:10px 12px}
.tally b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.tally span{font-size:12px;color:var(--muted)}

/* results */
.res{display:grid;gap:18px}
.res-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:26px 28px}
.score{position:relative;width:220px;height:150px;display:flex;align-items:center;justify-content:center}
.score svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.score path{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-dasharray:640;stroke-dashoffset:0;animation:draw 1s ease-out both}
@keyframes draw{from{stroke-dashoffset:640}to{stroke-dashoffset:0}}
.score-n{position:relative;font-family:var(--f-hand);font-weight:700;color:var(--red);font-size:64px;line-height:1;transform:rotate(-4deg);font-variant-numeric:tabular-nums}
.score-n small{font-size:38px}
.res-msg{font-family:var(--f-display);font-size:30px;font-weight:800;margin:0}
.res-meta{color:var(--muted);margin:4px 0 14px}
.res-stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;background:var(--paper);border:1px solid var(--line)}
.pill.g{color:var(--green);background:var(--green-soft);border-color:transparent}
.pill.r{color:var(--red);background:var(--red-soft);border-color:transparent}
.res-actions{display:flex;flex-wrap:wrap;gap:10px}
.block{padding:20px 22px}
.block>h2{font-size:22px;margin-bottom:4px}
.block>.note{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.trow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(80px,2fr) 64px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.trow:last-child{border-bottom:0}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.bar i.hi{background:var(--green)}.bar i.mid{background:var(--pencil-deep)}.bar i.lo{background:var(--red)}
.trow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.rv{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv-n{font-family:var(--f-hand);font-weight:700;font-size:26px;line-height:1}
.rv-n.ok{color:var(--green)}.rv-n.no{color:var(--red)}
.rv-q{margin:0 0 6px;font-weight:500}
.rv-a{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-bottom:6px}
.rv-a .yours.bad{color:var(--red);text-decoration:line-through}
.rv-a .yours.good{color:var(--green)}
.rv-a .corr{color:var(--green);font-weight:600}
.rv-e{margin:0;font-size:13.5px;color:var(--muted)}
.rv-t{font-size:12px;color:var(--muted)}

/* progress */
.prog{display:grid;gap:18px}
.prog-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.prog-head h1{font-size:clamp(26px,3.5vw,36px);font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:16px 18px}
.tile b{display:block;font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.status{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-strong{color:var(--green);background:var(--green-soft)}
.st-build{color:var(--pencil-deep);background:color-mix(in srgb,var(--pencil) 18%,transparent)}
.st-weak{color:var(--red);background:var(--red-soft)}
.st-new{color:var(--muted);background:var(--paper);border:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(70px,1.6fr) 78px 98px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.mrow:last-child{border-bottom:0}
.mrow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px dashed var(--line);white-space:nowrap}
td.sc{font-family:var(--f-hand);font-size:21px;font-weight:700;color:var(--red);line-height:1}
.manage{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet)}
.field textarea{min-height:84px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:13px;margin:8px 0 0;color:var(--green)}
.msg.err{color:var(--red)}

/* auth + parent review */
.auth{max-width:460px;margin:4vh auto 0}
.auth .box{padding:28px 26px}
.auth h1{font-size:30px;font-weight:800;margin-bottom:6px}
.auth .lead{color:var(--muted);margin:0 0 20px}
.gbtn{width:100%;gap:10px}
.gbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth .field input{font-size:16px}
.auth .btns .btn{flex:1}
.auth .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:13px}
.err-box{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}
.acct{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.acct.off .dot{background:var(--muted)}
.sync{font-size:13px;color:var(--muted);margin:4px 0 0}
.sync .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.sync.off .dot{background:var(--muted)}
.tm{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tm.slow{color:var(--pencil-deep);border-color:var(--pencil-deep)}
.tm.h{color:var(--blue);border-color:var(--blue)}
.ses-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;padding:22px 24px}
.ses-head .score{width:150px;height:104px}
.ses-head .score-n{font-size:46px}.ses-head .score-n small{font-size:28px}
td .btn-sm{padding:4px 10px}
.pin-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.pin-row .field{margin:0;flex:0 0 130px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(15,18,22,.45);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{width:min(440px,100%);padding:22px}
.modal h2{font-size:22px;margin-bottom:6px}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);margin-bottom:14px}
.modal .btns{justify-content:flex-end}

@media (max-width:900px){
  .setup{grid-template-columns:minmax(0,1fr)}
  .summary{position:static}
  .qgrid{grid-template-columns:minmax(0,1fr)}
  .startbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;gap:12px;align-items:center;background:var(--sheet);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .startbar p{margin:0;flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .has-startbar .wrap{padding-bottom:100px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .manage{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .nav button{padding:8px}
  .who label{display:none}
  .acct span{display:none}
  .ses-head{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
  .who{padding:2px 4px 2px 8px;min-width:0}
  .who select{max-width:104px}
  .top-in{gap:8px}
  .qbar .ctx{display:none}
  .opts{grid-template-columns:minmax(0,1fr)}
  .qcard{padding:20px 16px 18px 34px}
  .qcard::before{left:18px}
  .res-hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;padding:22px 18px}
  .res-stats,.res-actions{justify-content:center}
  .group{padding:16px}
  .grades .chip span{width:46px;height:46px}
  .mrow{grid-template-columns:minmax(0,1fr) 70px 92px}
  .mrow .bar{display:none}
  .trow{grid-template-columns:minmax(0,1fr) 70px 56px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ===== FIREBASE SETUP =====

<script>
/* ================= Sharpen question engine ================= */
/* helpers */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const r6=x=>Math.round(x*1e6)/1e6;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const range=(a,b)=>{const o=[];for(let i=a;i<=b;i++)o.push(i);return o;};
function fmt(n){if(typeof n==='string')return n;n=r6(n);const s=Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:6});return (n<0?'−':'')+s;}
function money(n){n=r6(n);const s=Number.isInteger(n)?Math.abs(n).toLocaleString('en-US'):Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?'−':'')+'$'+s;}
const SUPS={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup=n=>String(n).split('').map(c=>SUPS[c]||c).join('');
const decPlaces=x=>{const s=String(r6(x));const i=s.indexOf('.');return i<0?0:s.length-i-1;};
const NAMES=['Ada','Kemi','Sam','Leo','Priya','Omar','Grace','Ethan','Fatima','Lucas','Chloe','Tobi','Mei','Noah','Zara','Amir','Ella','Jonah','Nia','Ravi'];
const WEEK=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function tfmt(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;let h12=h%12;if(h12===0)h12=12;return `${h12}:${String(mm).padStart(2,'0')} ${h<12?'AM':'PM'}`;}
function dfmt(m){const h=Math.floor(m/60),mm=m%60;return h?(mm?`${h} h ${mm} min`:`${h} h`):`${mm} min`;}
function twoNames(){const a=pick(NAMES);let b=pick(NAMES);while(b===a)b=pick(NAMES);return [a,b];}

/* option builders */
function opts(answer,cands,filler){const out=[answer];for(const c of cands){if(out.length>=4)break;if(c!=null&&c!==''&&!out.includes(c))out.push(c);}let g=0;while(out.length<4&&filler&&g++<200){const c=filler();if(c!=null&&c!==''&&!out.includes(c))out.push(c);}return shuffle(out);}
function nopts(ans,specific=[],o={}){
  ans=r6(ans);const isInt=Number.isInteger(ans);
  const allowNeg=o.neg!=null?(o.neg||ans<0):ans<0;
  const f=o.f||fmt;
  const ok=v=>v!=null&&isFinite(v)&&v!==ans&&(allowNeg||v>=0)&&(!isInt||Number.isInteger(v))&&(o.min==null||v>=o.min)&&(o.max==null||v<=o.max);
  const mag=Math.abs(ans);
  let steps;
  if(isInt)steps=[1,2,Math.max(2,Math.round(mag*0.1)),10,Math.max(3,Math.round(mag*0.2))];
  else{const u=Math.pow(10,-decPlaces(ans));steps=[u,u*2,u*10,1];}
  const out=[ans];const shown=new Set([f(ans)]);
  const tryAdd=v=>{if(out.length>=4||!ok(v))return;const s=f(v);if(shown.has(s))return;shown.add(s);out.push(v);};
  for(const s of specific){tryAdd(s==null?null:r6(s));}
  let g=0;while(out.length<4&&g++<300){tryAdd(r6(ans+(Math.random()<0.5?-1:1)*pick(steps)*R(1,2)));}

  return {answer:f(ans),options:strs,value:ans};
}
function fr(n,d){if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;return [n/g,d/g];}
function fstr(f,mixed=true){let [n,d]=fr(f[0],f[1]);if(d===1)return fmt(n);const neg=n<0;n=Math.abs(n);if(mixed&&n>d){const w=Math.floor(n/d),r=n%d;return (neg?'−':'')+w+' '+r+'/'+d;}return (neg?'−':'')+n+'/'+d;}
function fracOpts(ans,cands,mixed=true){
  const seen=new Set();const out=[];const pos=ans[0]/ans[1]>0;
  const add=f=>{if(!f||!f[1]||!isFinite(f[0]/f[1]))return;if(!Number.isInteger(f[0])||!Number.isInteger(f[1]))return;const v=r6(f[0]/f[1]);if(pos&&v<=0)return;if(seen.has(v))return;seen.add(v);out.push(fstr(f,mixed));};
  add(ans);for(const c of cands){if(out.length>=4)break;add(c);}
  let g=0;while(out.length<4&&g++<200)add([ans[0]+R(-3,4),Math.abs(ans[1])+R(0,4)]);
  return {answer:out[0],options:shuffle(out),value:r6(ans[0]/ans[1])};
}
function digitwise(a,b,fn){const A=String(a),B=String(b).padStart(A.length,'0');let s='';for(let i=0;i<A.length;i++)s+=fn(+A[i],+B[i]);return +s;}

/* =============== MATHS =============== */
const M={};
M.add_sub=(g,d)=>{
  const digits=clamp(g+(d-2),2,6);const lo=10**(digits-1),hi=10**digits-1;
  const add=Math.random()<0.5;let a=R(lo,hi);const bd=Math.random()<0.5?digits:Math.max(2,digits-1);let b=R(10**(bd-1),10**bd-1);
  if(!add&&b>a)[a,b]=[b,a];if(!add&&a===b)a+=R(1,9);
  const ans=add?a+b:a-b;
  const wrong=add?digitwise(Math.max(a,b),Math.min(a,b),(x,y)=>(x+y)%10):digitwise(a,b,(x,y)=>Math.abs(x-y));
  const place=10**(digits-1);const ra=Math.round(a/place)*place,rb=Math.round(b/place)*place;
  return {q:`${fmt(a)} ${add?'+':'−'} ${fmt(b)} = ?`,...nopts(ans,[wrong,ans+10,ans-10,ans+place]),
    explain:`Line up the ones, tens, hundreds… and ${add?'add each column, carrying 1 to the next column when a column makes 10 or more':'subtract each column, borrowing from the next column when the top digit is smaller'}. ${fmt(a)} ${add?'+':'−'} ${fmt(b)} = ${fmt(ans)}. Check: ${add?`${fmt(ans)} − ${fmt(b)} = ${fmt(a)}`:`${fmt(ans)} + ${fmt(b)} = ${fmt(a)}`}.`,
    hint:`Estimate first: about ${fmt(ra)} ${add?'+':'−'} ${fmt(rb)} = ${fmt(add?ra+rb:ra-rb)}.`};
};
M.mult_facts=(g,d)=>{
  const max=g===3?[5,10,12][d-1]:[10,12,12][d-1];
  const a=(g===3&&d===1)?pick([2,5,10]):R(2,max),b=R(2,max);
  if(Math.random()<(g===3?0.25:0.35)){const p=a*b;return {q:`${p} ÷ ${a} = ?`,...nopts(b,[b+1,b-1,a===b?null:a]),explain:`Division undoes multiplication. Ask: ${a} × what = ${p}? Since ${a} × ${b} = ${p}, the answer is ${b}.`,hint:`Count in ${a}s until you reach ${p}.`};}
  const ans=a*b;
  return {q:`${a} × ${b} = ?`,...nopts(ans,[a*(b+1),a*(b-1),(a+1)*b,a+b]),explain:`${a} × ${b} means ${a} groups of ${b}. A quick way: ${a} × ${b-1} = ${a*(b-1)}, then add one more ${a}: ${a*(b-1)} + ${a} = ${ans}.`,hint:`Use a fact you know nearby, like ${a} × ${b-1}.`};
};
M.division=(g,d)=>{
  if(g===3){const dv=R(2,d===1?5:10),qv=R(2,10),p=dv*qv;return {q:`${p} ÷ ${dv} = ?`,...nopts(qv,[qv+1,qv-1,p-dv]),explain:`Division undoes multiplication. ${dv} × ${qv} = ${p}, so ${p} ÷ ${dv} = ${qv}.`,hint:`Count in ${dv}s until you reach ${p}.`};}
  if(g===4&&d>=2&&Math.random()<0.5){
    const dv=R(3,9),qv=R(12,d===3?199:99),rem=R(1,dv-1),p=dv*qv+rem;const ans=`${qv} R${rem}`;
    const alt=rem+1<dv?rem+1:rem-1;
    return {q:`${fmt(p)} ÷ ${dv} = ?`,answer:ans,options:opts(ans,[`${qv+1} R${rem}`,`${qv-1} R${rem}`,alt>0?`${qv} R${alt}`:null,`${qv}`]),
      explain:`${dv} goes into ${fmt(p)} ${qv} times: ${dv} × ${qv} = ${fmt(dv*qv)}. Left over: ${fmt(p)} − ${fmt(dv*qv)} = ${rem}. So the answer is ${qv} remainder ${rem}.`,hint:`Find the biggest multiple of ${dv} that is not more than ${fmt(p)}.`};
  }
  let dv,qv;
  if(g===4){dv=R(2,9);qv=R(d===1?11:20,d===3?199:99);}
  else if(g===5){if(d===3){dv=R(11,25);qv=R(12,99);}else{dv=R(3,9);qv=R(d===1?21:101,d===1?99:999);}}
  else{dv=R(11,d===3?48:25);qv=R(d===1?12:21,d===3?399:150);}
  const p=dv*qv;
  return {q:`${fmt(p)} ÷ ${dv} = ?`,...nopts(qv,[qv+1,qv-1,qv+10,qv*10,qv-10]),explain:`Use long division: divide, multiply, subtract, bring down, and repeat. ${fmt(p)} ÷ ${dv} = ${fmt(qv)}. Check by multiplying: ${dv} × ${fmt(qv)} = ${fmt(p)}.`,hint:`Estimate: ${dv} × ${fmt(Math.round(qv/10)*10||10)} = ${fmt(dv*(Math.round(qv/10)*10||10))}. Is the answer bigger or smaller?`};
};
M.multi_mult=(g,d)=>{
  const T={4:[[2,1],[3,1],[2,2]],5:[[3,1],[2,2],[3,2]],6:[[3,2],[3,2],[3,3]],7:[[3,2],[3,3],[4,2]]};
  const [da,db]=T[clamp(g,4,7)][d-1];
  const a=R(10**(da-1)+1,10**da-1);let b=db===1?R(3,9):R(10**(db-1)+1,10**db-1);if(db>1&&b%10===0)b+=R(1,9);const ans=a*b;
  let explain,wrong;
  if(db===1){const parts=String(a).split('').map((c,i,s)=>+c*10**(s.length-1-i)).filter(x=>x);explain=`Split ${fmt(a)} by place value and multiply each part by ${b}: ${parts.map(p=>`${fmt(p)} × ${b} = ${fmt(p*b)}`).join('; ')}. Add them: ${parts.map(p=>fmt(p*b)).join(' + ')} = ${fmt(ans)}.`;wrong=[ans+b,ans-10];}
  else{const parts=String(b).split('').map((c,i,s)=>+c*10**(s.length-1-i)).filter(x=>x);explain=`Multiply ${fmt(a)} by each place of ${fmt(b)}: ${parts.map(p=>`${fmt(a)} × ${fmt(p)} = ${fmt(a*p)}`).join('; ')}. Add the partial products: ${parts.map(p=>fmt(a*p)).join(' + ')} = ${fmt(ans)}.`;wrong=[String(b).split('').reduce((s,c)=>s+a*+c,0),ans+a,ans-a];}
  return {q:`${fmt(a)} × ${fmt(b)} = ?`,...nopts(ans,[...wrong,ans+10,ans-100]),explain,hint:`Estimate: ${fmt(Math.round(a/10**(da-1))*10**(da-1))} × ${fmt(db===1?b:Math.round(b/10**(db-1))*10**(db-1))}.`};
};
M.place_value=(g,d)=>{
  const t=pick(g>=5?['value','round','expanded','decimal']:['value','round','expanded']);
  const digits=clamp(g+d-1,3,7);
  const names={1:'ones',10:'tens',100:'hundreds',1000:'thousands',10000:'ten thousands',100000:'hundred thousands',1000000:'millions'};
  if(t==='value'){
    const k=R(1,9);const p=R(0,digits-1);const arr=[];for(let i=0;i<digits;i++){let x;do{x=R(i===digits-1?1:0,9);}while(x===k);arr.push(x);}arr[p]=k;
    const N=arr.reduce((s,x,i)=>s+x*10**i,0);const ans=k*10**p;
    return {q:`What is the value of the digit ${k} in ${fmt(N)}?`,...nopts(ans,[k*10**(p+1),p>0?k*10**(p-1):k*10**(p+2),k*10**(p+2)]),explain:`The ${k} is in the ${names[10**p]} place, so its value is ${k} × ${fmt(10**p)} = ${fmt(ans)}.`,hint:'Count places from the right: ones, tens, hundreds, thousands…'};
  }

    const places=[10,100,1000,10000].filter(p=>p<10**(digits-1)*10&&p<=(g<=3?100:g===4?1000:10000));const place=pick(places);
    const N=R(10**(digits-1),10**digits-1);const ans=Math.round(N/place)*place;const rd=Math.floor(N/(place/10))%10;
    const other=places.filter(p=>p!==place);
    return {q:`Round ${fmt(N)} to the nearest ${fmt(place)}.`,...nopts(ans,[Math.floor(N/place)*place,Math.ceil(N/place)*place,other.length?Math.round(N/other[0])*other[0]:null,ans+place]),explain:`Look at the digit just to the right of the ${names[place]} place: it is ${rd}. ${rd>=5?'That is 5 or more, so round up':'That is less than 5, so round down'}. ${fmt(N)} → ${fmt(ans)}.`,hint:`Which two multiples of ${fmt(place)} is ${fmt(N)} between?`};
  }
  if(t==='expanded'){
    let arr;do{arr=[];for(let i=0;i<digits;i++)arr.push(R(i===digits-1?1:0,9));arr[R(1,digits-2)]=0;}while(arr.filter(x=>x).length<Math.min(3,digits-1));
    const parts=arr.map((x,i)=>x*10**i).filter(x=>x).reverse();const N=parts.reduce((s,x)=>s+x,0);
    const squashed=+arr.slice().reverse().filter(x=>x).join('');
    return {q:`Which number is ${parts.map(fmt).join(' + ')}?`,...nopts(N,[squashed,N*10,N+10**R(1,digits-2)*1,Math.floor(N/10)]),explain:`Put each digit in its place, using 0 for any empty place: ${parts.map(fmt).join(' + ')} = ${fmt(N)}.`,hint:'Write the place-value columns and fill any empty place with 0.'};
  }
  const k=R(1,9),p=R(1,3);let arr=[];for(let i=0;i<4;i++){let x;do{x=R(0,9);}while(x===k);arr.push(x);}
  const whole=R(1,9);const decs=arr.slice(0,3);decs[p-1]=k;const N=r6(whole+decs[0]/10+decs[1]/100+decs[2]/1000);const ans=r6(k/10**p);
  const pn={1:'tenths',2:'hundredths',3:'thousandths'};
  return {q:`What is the value of the digit ${k} in ${fmt(N)}?`,...nopts(ans,[r6(k/10**(p===1?2:p-1)),r6(k/10**(p===3?1:p+1)),k]),explain:`After the decimal point the places are tenths, hundredths, thousandths. The ${k} is in the ${pn[p]} place, so its value is ${fmt(ans)}.`,hint:'The first place after the decimal point is tenths.'};

sent:[
[`The baby was very ___, so she fell asleep quickly.|tired|excited,noisy,awake|Being tired is what makes you fall asleep quickly.`,`We use an umbrella when it is ___.|raining|sunny,dry,hot|Umbrellas keep the rain off.`,`Right now, the children ___ in the park.|are playing|is playing,played,plays|"Right now" needs the present continuous, and "children" is plural, so "are playing".`,`There are ___ apples in the basket than oranges.|more|most,much,many|"Than" compares two things, so we use "more".`,`I have two ___ in my lunch box.|sandwiches|sandwich,sandwichs,sandwiche|Words ending in -ch add -es to make the plural.`,`He was so ___ that he shared his toys with everyone.|kind|selfish,angry,lazy|Sharing with everyone is a kind thing to do.`,`The sun ___ in the east every morning.|rises|sets,falls,sleeps|The sun comes up (rises) in the east.`,`A ___ is a baby frog.|tadpole|puppy,calf,cub|Frogs start life as tadpoles.`,`We ___ our homework before dinner yesterday.|finished|finish,finishing,will finish|"Yesterday" means the past tense: finished.`,`The glass was ___, so I poured some water into it.|empty|full,frozen,tall|You pour water into a glass that is empty.`,`An elephant is ___ than a mouse.|bigger|big,biggest,more big|Comparing two things uses the -er form: bigger.`,`The dog wagged ___ tail.|its|it's,it,their|"Its" shows belonging; "it's" means "it is".`,`Please ___ the door; it is cold outside.|close|open,paint,knock|Closing the door keeps the cold out.`,`The library is a ___ place, so we speak softly.|quiet|noisy,busy,messy|We speak softly because the library is quiet.`,`___ you like to play outside?|Would|Where,What,Was|"Would you like…" is the correct way to ask.`,`My friend and ___ walked to school together.|I|me,myself,mine|Take away "my friend and" — you would say "I walked", so use "I".`],
[`Despite the heavy rain, the game ___ as planned.|continued|stopped,halted,paused|"Despite" means the rain did not change the plan, so the game continued.`,`The scientist made a careful ___ before drawing a conclusion.|observation|celebration,decoration,invitation|Scientists observe before they conclude.`,`Neither the teacher nor the students ___ ready for the fire drill.|were|was,is,be|With "neither…nor", the verb agrees with the nearer subject, "students" (plural).`,`She was so ___ about the trip that she couldn't stop smiling.|excited|bored,upset,worried|Smiling non-stop shows excitement.`,`The ___ of the story was that honesty is the best policy.|moral|setting,title,cover|The lesson a story teaches is its moral.`,`He spoke so ___ that nobody could hear him.|softly|loudly,clearly,proudly|If nobody could hear, he spoke softly.`,`If I ___ you, I would study for the test.|were|was,am,be|Imaginary "if" sentences use "were" for every person.`,`The old bridge was ___, so the town built a new one.|unsafe|sturdy,modern,beautiful|A town replaces a bridge that is unsafe.`,`Our team practised hard; ___, we won the championship.|as a result|however,although,instead|Winning happened because of the practice, so "as a result".`,`The river's ___ was so strong that we couldn't swim across.|current|currant,curtain,crescent|A current is moving water; a currant is a small dried fruit.`,`Between you and ___, this is a secret.|me|I,myself,mine|After a preposition like "between", use "me".`,`___ backpack is this?|Whose|Who's,Who,Whom|"Whose" asks who owns something; "who's" means "who is".`,`The cold weather will ___ our plans for the picnic.|affect|effect,infect,afford|"Affect" is the verb (to change); "effect" is usually the noun.`,`Let's ___ our differences and work together.|set aside|set up,set off,set out|To set aside means to put to one side.`,`Each of the students ___ a library card.|has|have,are having,were having|"Each" is singular, so it takes "has".`],
[`The evidence was so ___ that the jury reached a verdict in minutes.|conclusive|ambiguous,irrelevant,scarce|A quick verdict needs evidence that settles the question: conclusive.`,`Although he was ___, he volunteered to speak first.|nervous|confident,eager,prepared|"Although" signals a contrast: being nervous but still volunteering.`,`The ___ student asked so many questions that the teacher praised her curiosity.|inquisitive|indifferent,lethargic,reluctant|Inquisitive means eager to ask questions and learn.`,`The committee will ___ its decision next week.|announce|denounce,pronounce,renounce|To announce is to make something publicly known.`,`His explanation was ___; it left us more confused than before.|convoluted|lucid,concise,straightforward|Convoluted means complicated and hard to follow.`,`The medicine ___ the pain but did not cure the illness.|alleviated|aggravated,intensified,ignored|Alleviated means made less severe.`,`She is the ___ of the two sisters.|taller|tallest,most tall,more taller|With two people, use the comparative form: taller.`,`The lawyer presented new evidence to ___ the witness's false claim.|refute|support,repeat,admire|To refute is to prove something wrong.`,`Had I known about the traffic, I ___ earlier.|would have left|will leave,would leave,had leave|"Had I known" talks about the past, so it pairs with "would have left".`,`The novel's ___ descriptions made readers feel they were really in 1920s Paris.|vivid|vague,dull,brief|Vivid descriptions create clear, lifelike pictures.`,`The two paintings are ___; even experts cannot tell them apart.|indistinguishable|incomparable,inexpensive,incomplete|Indistinguishable means impossible to tell apart.`,`Being ___, he saved most of his allowance.|frugal|extravagant,generous,careless|Frugal people are careful with money.`,`The principal, along with the teachers, ___ attending the meeting.|is|are,were,have|The subject is "the principal" (singular); "along with the teachers" is extra information.`,`His ___ remarks offended many people at the meeting.|tactless|tactful,diplomatic,considerate|Tactless remarks are thoughtless and hurtful.`,`The new policy will ___ next month, so everyone must be ready.|take effect|take affect,take part,take over|"Take effect" means start to apply.`]],

function bandFor(g,d){let b=g<=4?0:g<=6?1:2;if(d===1&&b>0&&Math.random()<0.5)b--;if(d===3&&b<2&&Math.random()<0.5)b++;return b;}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

function validQ(o){

  if(new Set(o.options).size!==o.options.length)return false;

function makeQuestion(subject,topicId,grade,d){

    let o;try{o=t.gen(grade,d);}catch(e){o=null;}
    if(validQ(o)){o.topic=topicId;o.d=d;if(o.value!=null&&!o.exact&&typeof o.value!=='number')o.value=null;return o;}
  }

}
function buildQuiz(cfg){
  const {subject,grade,topics,count,difficulty}=cfg;

function parseVal(s){

  if(snap.empty){ // first sign-in: upload everything on this device
    for(const [id,st] of Object.entries(DB.students)){cloud[id]=st;ups.push(base.collection('students').doc(id).set(forCloud(st)));}
  }else{ // keep cloud; bring across local students that have real work in them
    for(const [id,st] of Object.entries(DB.students)){if(!cloud[id]&&st.history&&st.history.length){cloud[id]=st;ups.push(base.collection('students').doc(id).set(forCloud(st)));}}
  }
  DB.students=cloud;
  if(!DB.students[DB.current])DB.current=Object.keys(DB.students)[0];
  if(!DB.current){const id=uid('st_');DB.students[id]=newStudent('Student');DB.current=id;ups.push(base.collection('students').doc(id).set(forCloud(DB.students[id])));}
  for(const s of SESSIONS.filter(s=>!s.synced&&DB.students[s.studentId]))ups.push(pushSession(s));
  await Promise.all(ups);saveLocal();
  CLOUD.unsub.push(base.collection('students').onSnapshot(qs=>{
    const next={};qs.forEach(d=>{next[d.id]=d.data();});
    if(!Object.keys(next).length)return;
    for(const id of Object.keys(CLOUD.timers))if(DB.students[id])next[id]=DB.students[id]; // keep unsent local edits
    DB.students=next;if(!DB.students[DB.current])DB.current=Object.keys(DB.students)[0];saveLocal();
    renderWho();softRefresh();
  },()=>{}));
  CLOUD.unsub.push(base.collection('sessions').orderBy('ts','desc').limit(300).onSnapshot(qs=>{
    CLOUD.sessions=qs.docs.map(d=>Object.assign({id:d.id},d.data()));softRefresh();
  },()=>{}));
}

/* ---------- QUIZ ---------- */
let QZ=null,TICK=null;
function startTick(){stopTick();TICK=setInterval(tick,250);}
function stopTick(){if(TICK)clearInterval(TICK);TICK=null;}
function clockIn(){if(QZ&&!QZ.enter)QZ.enter=Date.now();}
function clockOut(){if(QZ&&QZ.enter){QZ.ans[QZ.i].ms+=Date.now()-QZ.enter;QZ.enter=null;}}
function beginQuiz(cfg,qs){
  if(!qs.length)return;
  const L=limitOf(Object.assign({},cfg,{count:qs.length}));
  QZ={cfg,qs,L,ans:qs.map(()=>({sel:null,typed:'',locked:false,correct:null,hint:false,timedOut:false,ms:0})),i:0,t0:Date.now(),endAt:L.whole?Date.now()+L.whole*1000:null,qEnd:L.per?Date.now()+L.per*1000:null,flags:new Set(),streak:0,best:0,d:2,run:0,fin:false,enter:null,student:DB.current};
  renderWho();show('quiz');renderQuiz();clockIn();if(L.whole||L.per)startTick();
}
function startFromSettings(){
  const s=S();const topics=chosenTopics(s);if(!topics.length)return;
  const diff=s.mode==='test'&&s.difficulty==='adaptive'?'standard':s.difficulty;
  const cfg={grade:s.grade,subject:s.subject,mode:s.mode,count:s.count,timer:s.timer,timerStyle:s.timerStyle,custom:s.custom,difficulty:diff,answerStyle:typeAllowed(s)?s.answerStyle:'choose',topics};
  beginQuiz(cfg,buildQuiz({subject:cfg.subject,grade:cfg.grade,topics,count:cfg.count,difficulty:diff==='adaptive'?'standard':diff}));
}
const isTyping=q=>QZ.cfg.answerStyle==='type'&&canType(q);
const practice=()=>QZ.cfg.mode==='practice';
function answered(a){return a.locked||a.sel!=null||(a.typed&&a.typed.trim());}
function renderQuiz(){
  const q=QZ.qs[QZ.i],a=QZ.ans[QZ.i],n=QZ.qs.length,c=QZ.cfg;const P=practice();const per=!!QZ.L.per;
  const done=QZ.ans.filter(answered).length;const typing=isTyping(q);const keys='ABCD';
  let body;
  if(typing){const st=a.locked?(a.correct?'ok':'no'):'';

  tick();

function refreshNavOnly(){const a=QZ.ans[QZ.i];const b=document.querySelector(`.navgrid button[data-k="${QZ.i}"]`);if(b)b.classList.toggle('done',!!answered(a));const nb=$('#next-btn');if(nb&&nb.dataset.act==='next')nb.textContent=answered(a)?'Next':'Skip';}

function finish(timeUp){
  if(!QZ||QZ.fin)return;clockOut();QZ.fin=true;stopTick();
  const qs=QZ.qs;const by={};let right=0,skipped=0,hints=0;const typedCfg=QZ.cfg;

    a.skipped=!a.locked&&!answered(a);
    if(a.correct)right++;if(a.skipped)skipped++;if(a.hint)hints++;
    const b=by[q.topic]||(by[q.topic]={c:0,n:0,att:0});b.n++;if(a.correct)b.c++;if(!a.skipped)b.att++;});
  const secs=Math.round((Date.now()-QZ.t0)/1000);const pct=Math.round(right/qs.length*100);
  const sid=uid('se_');const stId=QZ.student;const st=DB.students[stId]||ST();
  const h={sid,ts:Date.now(),grade:QZ.cfg.grade,subject:QZ.cfg.subject,mode:QZ.cfg.mode,difficulty:QZ.cfg.difficulty,total:qs.length,correct:right,pct,secs,skipped,hints};
  st.history=st.history||[];st.history.push(h);if(st.history.length>300)st.history=st.history.slice(-300);
  st.stats=st.stats||{};const sub=st.stats[QZ.cfg.subject]||(st.stats[QZ.cfg.subject]={});
  for(const [tid,b] of Object.entries(by)){if(!b.att)continue;const r=sub[tid]||(sub[tid]={c:0,n:0});r.c+=qs.filter((q,k)=>q.topic===tid&&!QZ.ans[k].skipped&&QZ.ans[k].correct).length;r.n+=b.att;r.last=Date.now();}
  st.days=st.days||[];const d=today();if(!st.days.includes(d)){st.days.push(d);if(st.days.length>400)st.days=st.days.slice(-400);}
  const ses=Object.assign({id:sid,studentId:stId,studentName:st.name,timeUp:!!timeUp,answerStyle:QZ.cfg.answerStyle,topics:QZ.cfg.topics},h,{items:qs.map((q,k)=>{const a=QZ.ans[k];const typed=isTyping(q);return {q:q.q,topic:q.topic,d:q.d,answer:q.answer,options:typed?null:q.options,given:a.skipped?null:(typed?(a.typed||'').trim():a.sel),correct:!!a.correct,skipped:!!a.skipped,timedOut:!!a.timedOut,hint:!!a.hint,flagged:QZ.flags.has(k),ms:Math.round(a.ms),explain:q.explain};}),synced:false});
  SESSIONS.push(ses);saveSessionsLocal();save(stId);if(CLOUD.user)pushSession(ses);
  LAST={cfg:QZ.cfg,qs,ans:QZ.ans,by,right,skipped,hints,secs,pct,timeUp,flags:QZ.flags};
  renderWho();show('results');renderResults('all');

    <div class="manage"><div class="block sheet"><h2>Students</h2><p class="note">Each child has their own progress. A PIN stops siblings switching into each other's profile.</p>
        <div class="field"><label for="rename-in">Name</label><input id="rename-in" maxlength="24" value="${esc(st.name)}"></div>
        <div class="btns" style="margin-bottom:16px"><button class="btn btn-sm" data-act="rename">Save name</button><button class="btn btn-sm" data-act="add-student">Add a student</button></div>
        <div class="pin-row"><div class="field"><label for="pin-in">${st.pin?'New PIN':'Set a PIN'} (4–8 digits)</label><input id="pin-in" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><button class="btn btn-sm" data-act="set-pin">${st.pin?'Change PIN':'Set PIN'}</button>${st.pin?'<button class="btn btn-sm btn-quiet" data-act="clear-pin">Remove PIN</button>':''}</div>
        <div class="btns" style="margin-top:16px"><button class="btn btn-sm btn-danger" data-act="clear-student">Clear ${esc(st.name)}'s history</button>${Object.keys(DB.students).length>1?`<button class="btn btn-sm btn-danger" data-act="del-student">Remove ${esc(st.name)}</button>`:''}</div></div>
      <div class="block sheet">${CLOUD.user?`<h2>Account</h2><p class="note">Signed in as ${esc(CLOUD.user.email||CLOUD.user.displayName||'')}. Sign in with the same account on the tablet and on your phone, and both stay in step.</p><div class="btns"><button class="btn btn-sm" data-act="sign-out">Sign out on this device</button></div>`
        :`<h2>Move to another device</h2><p class="note">${CLOUD.enabled?'Signing in is the easy way. Without an account, copy this code and paste it into Sharpen on the other device.':'Copy this code, then paste it into Sharpen on the other device to bring all students across.'}</p>
        <div class="field"><label for="bk-out">Backup code</label><textarea id="bk-out" readonly>${backup}</textarea></div><div class="btns" style="margin-bottom:14px"><button class="btn btn-sm" data-act="copy-bk">Copy code</button></div>
        <div class="field"><label for="bk-in">Restore from a code</label><textarea id="bk-in" placeholder="Paste a backup code here"></textarea></div><div class="btns"><button class="btn btn-sm" data-act="restore">Restore</button></div>`}
        ${msg?`<p class="msg ${msg.err?'err':''}">${esc(msg.t)}</p>`:''}</div></div>
  </div>`;
}
function renderSession(sid,filter){
  const s=sessionFor(sid);if(!s){show('progress');renderProgress({t:'That session could not be found.',err:true});return;}
  const items=s.items||[];const n=items.length;const ms=items.map(i=>i.ms||0);const avg=n?ms.reduce((a,b)=>a+b,0)/n:0;
  const slowCut=Math.max(avg*1.75,20000);
  const list=items.map((it,k)=>({it,k})).filter(({it})=>filter==='all'||(filter==='wrong'&&!it.correct)||(filter==='slow'&&(it.ms||0)>=slowCut)||(filter==='hint'&&it.hint));
  const nWrong=items.filter(i=>!i.correct).length,nSlow=items.filter(i=>(i.ms||0)>=slowCut).length,nHint=items.filter(i=>i.hint).length;
  const by={};items.forEach(i=>{const b=by[i.topic]||(by[i.topic]={c:0,n:0});b.n++;if(i.correct)b.c++;});
  $('#v-session').innerHTML=`<div class="prog">
    <div><button class="btn btn-sm btn-quiet" data-act="go-progress">← Back to progress</button></div>
    <div class="ses-head sheet">${scoreMark(s.correct,s.total)}<div><p class="res-msg" style="font-size:26px">${esc(s.studentName||NAME(s.studentId))} · ${esc(subjName(s.subject))}</p>
      <p class="res-meta">${new Date(s.ts).toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})} · Grade ${s.grade} · ${s.mode==='test'?'Test':'Practice'} · ${diffName[s.difficulty]||'Standard'}${s.timeUp?' · Ran out of time':''}</p>
      <div class="res-stats"><span class="pill g">${s.correct} correct</span><span class="pill r">${s.total-s.correct-(s.skipped||0)} wrong</span>${s.skipped?`<span class="pill">${s.skipped} not answered</span>`:''}<span class="pill">${durTxt(s.secs)} total</span><span class="pill">${secTxt(avg)} per question on average</span>${nHint?`<span class="pill">${nHint} hint${nHint>1?'s':''}</span>`:''}</div>
      <div>${Object.entries(by).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([t,b])=>`<span class="tag" style="display:inline-block;margin:0 6px 6px 0">${esc(topicName(s.subject,t))}: ${b.c}/${b.n}</span>`).join('')}</div></div></div>
    <div class="block sheet"><h2>Every question</h2><p class="note">Time is how long ${esc(s.studentName||'they')} spent on each question. Slow ones are marked so you can see where they got stuck.</p>
      <div class="filters tabs" role="tablist"><button role="tab" aria-selected="${filter==='all'}" data-act="sf" data-f="all" data-k="${esc(sid)}">All (${n})</button><button role="tab" aria-selected="${filter==='wrong'}" data-act="sf" data-f="wrong" data-k="${esc(sid)}">Mistakes (${nWrong})</button><button role="tab" aria-selected="${filter==='slow'}" data-act="sf" data-f="slow" data-k="${esc(sid)}">Slow (${nSlow})</button>${nHint?`<button role="tab" aria-selected="${filter==='hint'}" data-act="sf" data-f="hint" data-k="${esc(sid)}">Used a hint (${nHint})</button>`:''}</div>
      ${list.length?list.map(({it,k})=>`<div class="rv"><span class="rv-n ${it.correct?'ok':'no'}">${it.correct?'✓':'✗'}</span><div><p class="rv-t">Question ${k+1} · ${esc(topicName(s.subject,it.topic))} · <span class="tm ${(it.ms||0)>=slowCut?'slow':''}">${secTxt(it.ms)}</span>${it.hint?' <span class="tm h">hint</span>':''}${it.flagged?' <span class="tm">flagged</span>':''}</p><p class="rv-q">${esc(it.q)}</p>
        <div class="rv-a"><span>Answered: <span class="yours ${it.correct?'good':'bad'}">${it.skipped?(it.timedOut?'Ran out of time':'Not answered'):esc(it.given||'—')}</span></span>${it.correct?'':`<span class="corr">Correct: ${esc(it.answer)}</span>`}</div>${it.options&&!it.correct?`<p class="rv-t">Choices: ${it.options.map(esc).join(' · ')}</p>`:''}<p class="rv-e">${esc(it.explain)}</p></div></div>`).join(''):'<p class="empty">Nothing in this filter.</p>'}</div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  switch(act){
    case 'go-setup': if(VIEW==='auth')return; if(VIEW==='quiz'&&QZ&&!QZ.fin){leave();return;} show('setup');renderSetup();break;
    case 'go-progress': if(VIEW==='quiz'&&QZ&&!QZ.fin){if(!await leave())return;} show('progress');renderProgress();break;
    case 'account': if(!CLOUD.enabled)return; if(CLOUD.user){if(VIEW==='quiz'&&QZ&&!QZ.fin)return;show('progress');renderProgress();document.querySelector('[data-act=sign-out]')&&document.querySelector('[data-act=sign-out]').scrollIntoView({block:'center'});}else{if(VIEW==='quiz'&&QZ&&!QZ.fin&&!await leave())return;CLOUD.err=CLOUD.failed?CLOUD.err:'';show('auth');renderAuth();}break;
    case 'g-signin': signInGoogle();break;
    case 'e-create': signInEmail(true);break;
    case 'e-reset': resetPw();break;
    case 'local-only': lsSet(LS_LOCAL,true);show('setup');renderSetup();renderWho();break;
    case 'sign-out': signOut();break;
    case 'topics-all':{const s=S();s.topicsBy[s.subject+'-'+s.grade]=availTopics(s).map(t=>t.id);save();renderSetup();break;}
    case 'topics-none':{const s=S();s.topicsBy[s.subject+'-'+s.grade]=[];save();renderSetup();break;}
    case 'start': startFromSettings();break;
    case 'pick': pickOpt(+b.dataset.k);break;
    case 'hint': QZ.ans[QZ.i].hint=true;renderQuiz();break;
    case 'next': go(1);break;
    case 'prev': go(-1);break;
    case 'jump': moveTo(+b.dataset.k);break;
    case 'flag': QZ.flags.has(QZ.i)?QZ.flags.delete(QZ.i):QZ.flags.add(QZ.i);renderQuiz();break;
    case 'submit': confirmSubmit();break;
    case 'leave': leave();break;
    case 'retry': retryMistakes();break;
    case 'weak': practiseWeak();break;
    case 'again': sameAgain();break;
    case 'rf': renderResults(b.dataset.f);document.getElementById('review').scrollIntoView({block:'start'});break;
    case 'ptab': PTAB=b.dataset.k;renderProgress();break;
    case 'sfilt': SFILT=b.dataset.k;renderProgress();break;
    case 'open-ses': show('session');renderSession(b.dataset.k,'all');break;
    case 'sf': renderSession(b.dataset.k,b.dataset.f);break;
    case 'add-student': if(await addStudent()){renderWho();renderProgress();}break;
    case 'rename':{const v=($('#rename-in').value||'').trim().slice(0,24);const st=ST();if(!v||v===st.name)return;if(Object.entries(DB.students).some(([id,s])=>id!==DB.current&&s.name.toLowerCase()===v.toLowerCase())){renderProgress({t:'That name is already used.',err:true});return;}st.name=v;save();renderWho();renderProgress({t:'Name saved.'});break;}
    case 'set-pin':{const v=($('#pin-in').value||'').trim();if(!/^\d{4,8}$/.test(v)){renderProgress({t:'Use 4 to 8 digits for the PIN.',err:true});return;}ST().pin=hashPin(v);save();renderWho();renderProgress({t:`PIN set. It is needed to switch into ${NAME()} on any device.`});break;}
    case 'clear-pin':{const st=ST();const p=await ask('Remove the PIN?',`Enter ${st.name}'s current PIN to remove it.`,{ok:'Remove PIN',input:'',secret:true});if(p===null)return;if(hashPin(p)!==st.pin){renderProgress({t:'That PIN is not right.',err:true});return;}st.pin=null;save();renderWho();renderProgress({t:'PIN removed.'});break;}
    case 'clear-student':{const st=ST();const ok=await ask(`Clear ${st.name}'s history?`,'All scores and topic progress for this student will be deleted.',{ok:'Clear history',cancel:'Cancel'});if(!ok)return;st.history=[];st.stats={};st.days=[];SESSIONS=SESSIONS.filter(s=>s.studentId!==DB.current);saveSessionsLocal();
      if(CLOUD.user){userRef().collection('sessions').where('studentId','==',DB.current).get().then(qs=>qs.forEach(d=>d.ref.delete())).catch(()=>{});}save();renderProgress({t:'History cleared.'});break;}
    case 'del-student':{const st=ST();const ok=await ask(`Remove ${st.name}?`,'This deletes the student and all of their progress.',{ok:'Remove student',cancel:'Cancel'});if(!ok)return;const id=DB.current;delete DB.students[id];DB.current=Object.keys(DB.students)[0];SESSIONS=SESSIONS.filter(s=>s.studentId!==id);saveSessionsLocal();saveLocal();
      if(CLOUD.user){clearTimeout(CLOUD.timers[id]);delete CLOUD.timers[id];userRef().collection('students').doc(id).delete().catch(()=>{});userRef().collection('sessions').where('studentId','==',id).get().then(qs=>qs.forEach(d=>d.ref.delete())).catch(()=>{});}renderWho();renderProgress();break;}
    case 'copy-bk':{const ta=$('#bk-out');try{await navigator.clipboard.writeText(ta.value);renderProgress({t:'Backup code copied.'});}catch(err){ta.focus();ta.select();const m=document.createElement('p');m.className='msg';m.textContent='Copy is blocked here. The code is selected, so press Ctrl+C or ⌘C.';ta.parentNode.after(m);}break;}
    case 'restore':{const raw=($('#bk-in').value||'').trim();if(!raw)return;let d;try{d=JSON.parse(decodeURIComponent(escape(atob(raw))));}catch(err){d=null;}if(!d||!d.students||!Object.keys(d.students).length){renderProgress({t:'That code could not be read. Copy the whole code and try again.',err:true});return;}
      const ok=await ask('Replace data on this device?',`This loads ${Object.keys(d.students).length} student${Object.keys(d.students).length>1?'s':''} from the code and replaces what is saved here.`,{ok:'Restore',cancel:'Cancel'});if(!ok)return;lsSet(LS,d);DB=loadDB();saveLocal();renderWho();renderProgress({t:'Progress restored.'});break;}
  }
});
document.addEventListener('keydown',e=>{
  if(VIEW!=='quiz'||!QZ||QZ.fin||!$('#modal').hidden)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();const idx='1234'.indexOf(k)>=0?'1234'.indexOf(k):'abcd'.indexOf(k);
  if(idx>=0&&k.length===1){e.preventDefault();pickOpt(idx);return;}
  if(k==='enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(practice()){if(QZ.ans[QZ.i].locked)go(1);}else{QZ.i===QZ.qs.length-1?confirmSubmit():go(1);}return;}
  if(k==='h'&&practice()&&!QZ.ans[QZ.i].locked){QZ.ans[QZ.i].hint=true;renderQuiz();return;}
  if(k==='f'&&!practice()){QZ.flags.has(QZ.i)?QZ.flags.delete(QZ.i):QZ.flags.add(QZ.i);renderQuiz();return;}
  if(k==='arrowright'&&!practice()&&!QZ.L.per)go(1);if(k==='arrowleft'&&!practice()&&!QZ.L.per)go(-1);
});
document.addEventListener('visibilitychange',()=>{if(!QZ||QZ.fin||VIEW!=='quiz')return;if(document.hidden)clockOut();else if(!QZ.ans[QZ.i].locked)clockIn();});

saveLocal();renderWho();
if(CLOUD.enabled&&!lsGet(LS_LOCAL,false)&&!lsGet(LS_IN,false)){show('auth');renderAuth();}else{show('setup');renderSetup();}
initCloud();
})();

</script>
